<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>baby for youu good luckk</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#fff5f9; --bg2:#ffdfec; --ink:#c2447a; --sub:#e0699b; --glow:rgba(255,160,200,.55);
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg1:#2b1823; --bg2:#1c0f16; --ink:#ffb5d2; --sub:#ff8fba; --glow:rgba(255,120,175,.3); color-scheme:dark;}
}
:root[data-theme="dark"]{--bg1:#2b1823; --bg2:#1c0f16; --ink:#ffb5d2; --sub:#ff8fba; --glow:rgba(255,120,175,.3); color-scheme:dark;}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(circle at 50% 30%, var(--bg1), var(--bg2));
  font-family:'Quicksand',system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative;text-align:center;
}
main{position:relative;z-index:2;width:min(92vw,460px);padding:12px;}
svg{width:100%;height:auto;max-height:52vh;filter:drop-shadow(0 12px 26px var(--glow));animation:sway 6s ease-in-out infinite;transform-origin:50% 90%}
h1{
  font-family:'Dancing Script','Brush Script MT',cursive;
  font-size:clamp(34px,9vw,52px);line-height:1.1;margin:10px 0 4px;color:var(--ink);
}
p{margin:0;font-weight:600;font-size:clamp(20px,5.5vw,28px);color:var(--sub);letter-spacing:.5px;animation:pulse 2s ease-in-out infinite}
small{display:block;margin-top:14px;color:var(--sub);opacity:.7;font-size:13px}
.fall,.heart{position:fixed;pointer-events:none;z-index:1}
.fall{top:-40px;width:16px;height:22px;background:linear-gradient(#ffc2d9,#ff8fba);border-radius:80% 0 80% 0;opacity:.8;animation:fall linear infinite}
.heart{z-index:3;font-size:24px;animation:rise 1.4s ease-out forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg) translateX(40px)}}
@keyframes rise{to{transform:translateY(-140px) scale(1.6);opacity:0}}
@keyframes sway{50%{transform:rotate(1.8deg)}}
@keyframes pulse{50%{transform:scale(1.07)}}
@media (prefers-reduced-motion: reduce){svg,p,.fall{animation:none}}
</style>
</head>
<body>
<main>
  <svg id="art" viewBox="0 0 400 340" aria-label="A bouquet of pink peonies"></svg>
  <h1>Goodluck in your midterms baby</h1>
  <p>mwamwaaaa </p>
  <small>tap anywhere for kisses</small>
</main>
<script>
const stops=(a,b)=>`<stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/>`;
const grads=[['gA','#ff9fc4','#ffe1ec'],['gB','#f4739f','#ffc0d6'],['gC','#ec5c91','#ff9fc4'],['gD','#d93f7a','#f67fae'],['gE','#c42f6c','#e4559a']]
  .map(([id,a,b])=>`<linearGradient id="${id}" x1="0" y1="1" x2="0" y2="0">${stops(a,b)}</linearGradient>`).join('');
const ring=(n,sc,off,g)=>Array.from({length:n},(_,i)=>`<use href="#petal" fill="url(#${g})" stroke="rgba(255,255,255,.45)" stroke-width=".8" transform="rotate(${off+i*360/n}) scale(${sc})"/>`).join('');
const peony=(x,y,s,r)=>`<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})">${ring(12,1,0,'gA')}${ring(10,.82,15,'gB')}${ring(8,.62,8,'gC')}${ring(7,.42,20,'gD')}${ring(5,.24,0,'gE')}<circle r="5" fill="#ffd36e" opacity=".9"/></g>`;
const leaf=(x,y,r,s)=>`<use href="#leaf" transform="translate(${x} ${y}) rotate(${r}) scale(${s})" fill="#8fcf9f"/>`;
document.getElementById('art').innerHTML=`<defs>${grads}
<path id="petal" d="M0,0 C-30,-18 -38,-60 -12,-78 C-4,-84 4,-84 12,-78 C38,-60 30,-18 0,0Z"/>
<path id="leaf" d="M0,0 C-26,-20 -26,-60 0,-90 C26,-60 26,-20 0,0Z"/></defs>
${leaf(200,330,-70,1.2)}${leaf(200,330,70,1.2)}${leaf(200,330,-25,1.1)}${leaf(200,330,25,1.1)}
${leaf(90,330,-40,.9)}${leaf(310,330,40,.9)}
<g stroke="#6fb584" stroke-width="3" stroke-linecap="round" fill="none"><path d="M200 330 V200"/><path d="M90 330 Q85 290 82 262"/><path d="M310 330 Q315 290 320 255"/></g>
${peony(82,235,.78,10)}${peony(320,230,.85,-8)}${peony(200,160,1.5,0)}`;

// falling petals
for(let i=0;i<14;i++){const f=document.createElement('div');f.className='fall';
  f.style.left=Math.random()*100+'vw';f.style.animationDuration=(7+Math.random()*7)+'s';
  f.style.animationDelay=(-Math.random()*12)+'s';f.style.transform=`scale(${.6+Math.random()*.8})`;document.body.appendChild(f);}
// kisses on tap
addEventListener('pointerdown',e=>{const h=document.createElement('div');h.className='heart';
  h.textContent=['💗','💋','🌸','💖'][Math.floor(Math.random()*4)];
  h.style.left=e.clientX-12+'px';h.style.top=e.clientY-12+'px';document.body.appendChild(h);setTimeout(()=>h.remove(),1400);});
</script>
</body>
</html>
